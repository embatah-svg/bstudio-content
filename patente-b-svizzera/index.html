<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theorie B – Deutsch / العربية</title>
<meta name="description" content="Lern-App für die Basistheorieprüfung Kategorie B in der Schweiz, zweisprachig Deutsch–Arabisch.">
<meta name="theme-color" content="#F2C230">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Theorie B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF7; --card:#FFFFFF; --ink:#1A1D22; --ink-2:#5A6069; --line:#E2DFD8;
  --yellow:#F2C230; --red:#C8102E; --blue:#005A9C; --green:#007A45;
  --ok:#0E7C52; --ok-bg:#E7F4ED; --no-bg:#FCEAEC;
  --r:14px; --pad:18px;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ar:"IBM Plex Sans Arabic","Noto Naskh Arabic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.hbar{display:flex;align-items:center;gap:12px;height:58px}
.mark{width:26px;height:26px;background:var(--yellow);transform:rotate(45deg);border:2px solid var(--ink);flex:none;border-radius:3px}
.brand{font-weight:700;letter-spacing:-.01em;font-size:17px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--ink-2);letter-spacing:.02em}
.langsw{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.langsw button{border:0;background:transparent;padding:6px 11px;font-size:12.5px;font-weight:600;line-height:1}
.langsw button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- generic ---------- */
h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:24px 0 6px;font-weight:700}
h2{font-size:19px;margin:26px 0 10px;letter-spacing:-.01em}
.lede{color:var(--ink-2);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad)}
.ar{font-family:var(--ar);direction:rtl;text-align:right;line-height:1.85}
.pair .de{display:block}
.pair .ar{display:block;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);color:#33383F}
body[data-lang="de"] .pair .ar{display:none}
body[data-lang="ar"] .pair .de{display:none}
body[data-lang="ar"] .pair .ar{margin-top:0;padding-top:0;border-top:0}

/* ---------- home ---------- */
.hero{display:flex;align-items:center;gap:20px;margin:22px 0 6px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:22px}
.hero p{margin:0;color:var(--ink-2);font-size:14.5px}
.hero .big{color:var(--ink);font-weight:600;font-size:16px;margin-bottom:4px}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin:16px 0}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;display:block}
.tile b{display:block;font-size:15.5px;margin-bottom:2px}
.tile span{font-size:12.5px;color:var(--ink-2)}
.tile.full{grid-column:1/-1;border-color:var(--ink);border-width:1.5px}
.note{border-left:4px solid var(--yellow);background:#FFFCF1;padding:13px 15px;border-radius:0 10px 10px 0;font-size:14px;margin:16px 0}

/* ---------- lists ---------- */
.row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:9px}
.row .ic{width:34px;height:34px;flex:none;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);border-radius:9px;font-weight:700;font-size:14px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;font-weight:600}
.row .tx span{font-size:13px;color:var(--ink-2)}
.row .tx span.ar{font-family:var(--ar);direction:rtl;text-align:right;display:block}
body[data-lang="de"] .row .tx span.ar{display:none}
body[data-lang="ar"] .row .tx b{display:none}
.chev{color:var(--ink-2);flex:none}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--green)}

/* ---------- theory points ---------- */
ol.points{list-style:none;padding:0;margin:0;counter-reset:p}
ol.points li{counter-increment:p;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px 15px 46px;position:relative;margin-bottom:10px;font-size:15.5px}
ol.points li::before{content:counter(p);position:absolute;left:15px;top:15px;font-weight:700;font-size:12px;color:var(--ink-2)}

/* ---------- quiz ---------- */
.qmeta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);margin:18px 0 10px}
.qmeta .pill{background:var(--ink);color:#fff;border-radius:999px;padding:3px 10px;font-weight:600;font-size:12px}
.qmeta .timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.scene{border-radius:14px;overflow:hidden;margin:0 0 14px;line-height:0;border:1px solid var(--line)}
.scene svg{display:block;width:100%;height:auto}
.qtext{font-size:18px;font-weight:600;line-height:1.35;margin:0 0 4px}
.qtext .ar{font-weight:500;font-size:17px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;font-size:15px;transition:border-color .12s,background .12s}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#F4F2ED}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--red);background:var(--no-bg)}
.opt .tag{float:right;font-size:12px;font-weight:700;margin-left:8px}
.opt.good .tag{color:var(--ok)} .opt.bad .tag{color:var(--red)}
.expl{border-radius:12px;padding:14px 16px;margin:14px 0;font-size:14.5px}
.expl.win{background:var(--ok-bg);border:1px solid #BFE0CE}
.expl.lose{background:var(--no-bg);border:1px solid #F0C6CC}
.expl b{display:block;margin-bottom:6px}
.actions{display:flex;gap:10px;margin:16px 0 8px}
.btn{flex:1;border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:12px;padding:14px;font-weight:600;font-size:15.5px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4}
.progline{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:2px}
.progline i{display:block;height:100%;background:var(--ink)}

/* ---------- result ---------- */
.score{text-align:center;padding:26px 18px}
.score .num{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1}
.score .verdict{font-weight:700;font-size:19px;margin-top:8px}
.score.pass .verdict{color:var(--ok)} .score.fail .verdict{color:var(--red)}

/* ---------- glossary ---------- */
.search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font:inherit;background:var(--card);margin-bottom:12px}
table.gl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table.gl td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
table.gl tr:last-child td{border-bottom:0}
table.gl td.a{font-weight:500;width:52%}
table.gl td.b{font-family:var(--ar);direction:rtl;text-align:right;color:#33383F}

/* ---------- Schilderkatalog ---------- */
.signgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px}
.signcard{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.signcard .simg{width:100%;aspect-ratio:1/1;margin-bottom:6px}
.signcard .simg svg{width:100%;height:100%;display:block}
.signcard .sname{font-size:12px;font-weight:600;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.signcard .sname.ar{font-family:var(--ar);direction:rtl}
body[data-lang="de"] .signcard .sname.ar{display:none}
body[data-lang="ar"] .signcard .sname.de{display:none}
.signnote{font-size:12.5px;color:var(--ink-2);margin-top:16px 0 24px;padding:0}
@media (min-width:560px){.signgrid{grid-template-columns:repeat(4,1fr)}}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(251,250,247,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nb{display:flex;max-width:720px;margin:0 auto}
.nb button{flex:1;border:0;background:transparent;padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-2);font-weight:500}
.nb button .d{width:9px;height:9px;border:1.5px solid currentColor;transform:rotate(45deg);border-radius:2px}
.nb button[aria-current="page"]{color:var(--ink);font-weight:700}
.nb button[aria-current="page"] .d{background:var(--yellow);border-color:var(--ink)}
.back{border:0;background:transparent;padding:14px 0 4px;font-size:14px;font-weight:600;color:var(--ink-2)}
.empty{text-align:center;color:var(--ink-2);padding:40px 20px;font-size:15px}
footer{color:var(--ink-2);font-size:12.5px;text-align:center;padding:26px 10px 8px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}.tile.full{grid-column:1/-1}}
</style>
</head>
<body data-lang="both">

<header>
  <div class="wrap hbar">
    <div class="mark" aria-hidden="true"></div>
    <div class="brand">Theorie B <small>Kanton Solothurn · تعلّم بالعربية</small></div>
    <div class="langsw" role="group" aria-label="Sprache">
      <button data-lang="both" aria-pressed="true">DE+ع</button>
      <button data-lang="de" aria-pressed="false">DE</button>
      <button data-lang="ar" aria-pressed="false">ع</button>
    </div>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav>
  <div class="nb">
    <button data-go="home" aria-current="page"><span class="d"></span>Start</button>
    <button data-go="theorie"><span class="d"></span>Theorie</button>
    <button data-go="quiz"><span class="d"></span>Quiz</button>
    <button data-go="pruefung"><span class="d"></span>Prüfung</button>
    <button data-go="schilder"><span class="d"></span>Schilder</button>
    <button data-go="woerter"><span class="d"></span>Wörter</button>
  </div>
</nav>

<script src="data.js"></script>
<script src="scenes.js"></script>
<script>
/* ---------- storage (fällt still auf Speicher im RAM zurück) ---------- */
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? (k in mem ? mem[k] : d) : JSON.parse(v); } catch (e) { return k in mem ? mem[k] : d; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const view = document.getElementById('view');
const T = (o) => `<span class="pair"><span class="de">${o.de}</span><span class="ar" dir="rtl" lang="ar">${o.ar}</span></span>`;
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let state = { screen: 'home', mod: null, quiz: null };

/* ---------- Fortschritt: Kapitel gelesen + Leitner-Boxen pro Frage ---------- */
const getDone = () => store.get('doneMods', []);
const getBox = () => store.get('qbox', {});
const getChapStats = () => store.get('chapStats', {});
function setBoxLevel(i, ok) {
  const b = getBox();
  b[i] = ok ? Math.min(4, (b[i] || 0) + 1) : 0;
  store.set('qbox', b);
}
function bumpChapStats(c, ok) {
  const s = getChapStats();
  if (!s[c]) s[c] = { a: 0, c: 0 };
  s[c].a++; if (ok) s[c].c++;
  store.set('chapStats', s);
}
function wrongIndices() {
  const b = getBox();
  return Object.keys(b).map(Number).filter(i => b[i] === 0);
}
function smartIndices(sessionSize) {
  sessionSize = sessionSize || 20;
  const b = getBox();
  const weight = i => { const lvl = b[i] || 0; return lvl === 0 ? 1 : (lvl === 1 ? 0.6 : (lvl === 2 ? 0.35 : (lvl === 3 ? 0.15 : 0.05))); };
  let pool = FRAGEN.map((_, i) => i), chosen = [];
  const n = Math.min(sessionSize, pool.length);
  for (let k = 0; k < n; k++) {
    const weights = pool.map(weight);
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total, idx = 0;
    for (; idx < weights.length; idx++) { r -= weights[idx]; if (r <= 0) break; }
    idx = Math.min(idx, pool.length - 1);
    chosen.push(pool[idx]); pool.splice(idx, 1);
  }
  return chosen;
}

/* ---------- Screens ---------- */
function home() {
  const cs = getChapStats();
  let totA = 0, totC = 0;
  MODULES.forEach(m => { const s = cs[m.id]; if (s) { totA += s.a; totC += s.c; } });
  const p = totA ? Math.round(totC / totA * 100) : 0;
  const C = 2 * Math.PI * 46, best = store.get('bestExam', null), w = wrongIndices().length;
  view.innerHTML = `
  <div class="hero">
    <div class="ring">
      <svg width="104" height="104"><circle cx="52" cy="52" r="46" fill="none" stroke="#E2DFD8" stroke-width="9"/>
      <circle cx="52" cy="52" r="46" fill="none" stroke="#007A45" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C - C * p / 100}"/></svg>
      <div class="val">${totA ? p + '%' : '–'}</div>
    </div>
    <div>
      <p class="big">${totA ? 'Deine Trefferquote' : 'Noch keine Übung'}</p>
      <p>${totA} Antworten geübt${best !== null ? ` · beste Prüfung ${best}%` : ''}</p>
      <p class="ar" dir="rtl" lang="ar" style="margin-top:6px">${totA} إجابة تدربت عليها</p>
    </div>
  </div>

  <div class="grid">
    <button class="tile full" data-go="pruefung"><b>Prüfung simulieren</b><span>50 Fragen · 45 Minuten · امتحان تجريبي</span></button>
    <button class="tile full" data-quiz="smart"><b>Intelligentes Training</b><span>Wiederholt Fragen, bevor du sie vergisst · تدريب ذكي</span></button>
    <button class="tile" data-go="theorie"><b>Theorie</b><span>${MODULES.length} Kapitel</span></button>
    <button class="tile" data-go="quiz"><b>Quiz</b><span>${FRAGEN.length} Fragen</span></button>
    <button class="tile" data-go="schilder"><b>Schilder</b><span>${SIGNS.length} Signale</span></button>
    <button class="tile" data-go="woerter"><b>Wörter</b><span>${GLOSSAR.length} Begriffe</span></button>
    <button class="tile" data-go="stats"><b>Fortschritt</b><span>Nach Kapitel · حسب الفصل</span></button>
    ${w ? `<button class="tile full" data-quiz="wrong"><b>Meine Fehler (${w})</b><span>Falsch beantwortete Fragen wiederholen · أخطائي</span></button>` : ''}
  </div>

  <div class="note">
    <b>Wichtig:</b> Die Theorieprüfung im Kanton Solothurn gibt es auf Deutsch, Französisch, Italienisch und Englisch – nicht auf Arabisch. Übe darum immer den deutschen Text mit, das Arabische ist die Erklärung dazu.
    <span class="ar" dir="rtl" lang="ar" style="display:block;margin-top:8px">مهم: الامتحان النظري في كانتون زولوتورن متاح بالألمانية والفرنسية والإيطالية والإنجليزية — وليس بالعربية. لذلك تدرّب دائماً على النص الألماني، والعربية هي الشرح المرافق.</span>
  </div>

  <h2>Kapitel weiterlesen</h2>
  ${MODULES.filter(m => !getDone().includes(m.id)).slice(0, 3).map(rowMod).join('') || '<p class="lede">Alle Kapitel gelesen. Jetzt Fragen trainieren.</p>'}
  <footer>Eigene Übungsfragen und Zeichnungen nach SVG, VRV und SSV.<br>Nicht der offizielle Fragenkatalog der asa.</footer>`;
}

const rowMod = m => {
  const done = getDone().includes(m.id);
  const qs = FRAGEN.filter(f => f.c === m.id).length;
  return `<button class="row" data-mod="${m.id}">
    <span class="ic">${m.icon}</span>
    <span class="tx"><b>${m.de}</b><span class="ar" dir="rtl" lang="ar">${m.ar}</span>
    <span style="display:block">${m.points.length} Punkte · ${qs} Fragen${done ? ' · ✓' : ''}</span></span>
    <span class="chev">›</span></button>`;
};

function theorie() {
  view.innerHTML = `<h1>Theorie</h1><p class="lede">Kurze Kapitel, jeder Punkt auf Deutsch und Arabisch.</p>
  ${MODULES.map(rowMod).join('')}`;
}

function modul(id) {
  const m = MODULES.find(x => x.id === id);
  const done = getDone().includes(id);
  view.innerHTML = `<button class="back" data-go="theorie">‹ Theorie</button>
  <h1>${m.de}</h1><p class="lede ar" dir="rtl" lang="ar">${m.ar}</p>
  <ol class="points">${m.points.map(p => `<li>${T(p)}</li>`).join('')}</ol>
  <div class="actions">
    <button class="btn ghost" data-done="${id}">${done ? '✓ Gelesen' : 'Als gelesen markieren'}</button>
    <button class="btn" data-quiz="${id}">Quiz dazu</button>
  </div>`;
}

function quizMenu() {
  const w = wrongIndices().length;
  view.innerHTML = `<h1>Quiz</h1><p class="lede">Nach Kapitel üben. Eine oder zwei Antworten sind richtig.</p>
  <button class="row" data-quiz="smart"><span class="ic">◆</span><span class="tx"><b>Intelligentes Training</b><span class="ar" dir="rtl" lang="ar">تدريب ذكي</span><span style="display:block">Mischung aus Neuem und Fälligem</span></span><span class="chev">›</span></button>
  <button class="row" data-quiz="all"><span class="ic">∑</span><span class="tx"><b>Alle Fragen gemischt</b><span class="ar" dir="rtl" lang="ar">كل الأسئلة مختلطة</span><span style="display:block">${FRAGEN.length} Fragen</span></span><span class="chev">›</span></button>
  ${w ? `<button class="row" data-quiz="wrong"><span class="ic">!</span><span class="tx"><b>Meine Fehler</b><span class="ar" dir="rtl" lang="ar">أخطائي</span><span style="display:block">${w} Fragen</span></span><span class="chev">›</span></button>` : ''}
  <h2>Nach Kapitel</h2>
  ${MODULES.map(m => `<button class="row" data-quiz="${m.id}"><span class="ic">${m.icon}</span><span class="tx"><b>${m.de}</b><span class="ar" dir="rtl" lang="ar">${m.ar}</span><span style="display:block">${FRAGEN.filter(f => f.c === m.id).length} Fragen</span></span><span class="chev">›</span></button>`).join('')}`;
}

function stats() {
  const cs = getChapStats(), b = getBox();
  let totA = 0, totC = 0;
  MODULES.forEach(m => { const s = cs[m.id]; if (s) { totA += s.a; totC += s.c; } });
  const pct = totA ? Math.round(totC / totA * 100) : 0, C = 2 * Math.PI * 46;
  const rows = MODULES.map(m => {
    const s = cs[m.id] || { a: 0, c: 0 };
    const p = s.a ? Math.round(s.c / s.a * 100) : 0;
    const color = !s.a ? 'var(--line)' : (p >= 80 ? 'var(--ok)' : (p >= 50 ? 'var(--yellow)' : 'var(--red)'));
    return `<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px">
        <span>${m.de}</span><span style="color:var(--ink-2)">${s.a ? p + '%' : '– keine Übung'}</span>
      </div>
      <div class="bar" style="height:7px"><i style="width:${s.a ? p : 0}%;background:${color}"></i></div>
    </div>`;
  }).join('');
  let neu = 0, lern = 0, sicher = 0, meister = 0;
  for (let i = 0; i < FRAGEN.length; i++) {
    const lvl = b[i];
    if (lvl === undefined) neu++; else if (lvl <= 1) lern++; else if (lvl <= 3) sicher++; else meister++;
  }
  view.innerHTML = `<h1>Fortschritt</h1>
  <div class="hero">
    <div class="ring"><svg width="104" height="104"><circle cx="52" cy="52" r="46" fill="none" stroke="#E2DFD8" stroke-width="9"/>
    <circle cx="52" cy="52" r="46" fill="none" stroke="var(--ok)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C - C * pct / 100}"/></svg>
    <div class="val">${totA ? pct + '%' : '–'}</div></div>
    <div><p class="big">${totA} Antworten insgesamt</p><p>${totC} davon richtig</p>
    <p class="ar" dir="rtl" lang="ar" style="margin-top:6px">${totC} من ${totA} إجابة صحيحة</p></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(4,1fr);margin:18px 0 22px">
    <div class="card" style="padding:10px 4px;text-align:center"><div style="font-size:19px;font-weight:700">${neu}</div><div style="font-size:10.5px;color:var(--ink-2)">Neu</div></div>
    <div class="card" style="padding:10px 4px;text-align:center"><div style="font-size:19px;font-weight:700">${lern}</div><div style="font-size:10.5px;color:var(--ink-2)">Am Lernen</div></div>
    <div class="card" style="padding:10px 4px;text-align:center"><div style="font-size:19px;font-weight:700">${sicher}</div><div style="font-size:10.5px;color:var(--ink-2)">Sicher</div></div>
    <div class="card" style="padding:10px 4px;text-align:center"><div style="font-size:19px;font-weight:700">${meister}</div><div style="font-size:10.5px;color:var(--ink-2)">Beherrscht</div></div>
  </div>
  <h2>Nach Kapitel</h2>
  ${rows}
  <div class="actions"><button class="btn" data-quiz="smart">Intelligentes Training starten</button></div>`;
}

function pruefungIntro() {
  const best = store.get('bestExam', null);
  view.innerHTML = `<h1>Prüfung simulieren</h1>
  <p class="lede">50 Fragen, 45 Minuten. Jede falsch beantwortete Frage gibt 3 Fehlerpunkte. Ab mehr als 15 Fehlerpunkten ist die Prüfung nicht bestanden – du darfst also höchstens 5 Fragen falsch haben.</p>
  <div class="card ar" dir="rtl" lang="ar">50 سؤالاً في 45 دقيقة. كل سؤال خاطئ = 3 نقاط خطأ. تُعتبر راسباً إذا تجاوزت 15 نقطة، أي يُسمح لك بـ 5 أخطاء كحد أقصى.</div>
  ${best !== null ? `<p class="lede" style="margin-top:16px">Bestes Ergebnis bisher: <b>${best}%</b></p>` : ''}
  <div class="actions"><button class="btn" data-exam="1">Prüfung starten</button></div>`;
}

function woerter(filter = '') {
  const f = filter.toLowerCase();
  const rows = GLOSSAR.filter(g => !f || g[0].toLowerCase().includes(f) || g[1].includes(filter));
  view.innerHTML = `<h1>Wörter</h1><p class="lede">Die Begriffe, die in den Prüfungsfragen vorkommen.</p>
  <input class="search" id="gs" type="search" placeholder="Suchen / بحث" value="${esc(filter)}" autocomplete="off">
  ${rows.length ? `<table class="gl"><tbody>${rows.map(g => `<tr><td class="a">${g[0]}</td><td class="b" dir="rtl" lang="ar">${g[1]}</td></tr>`).join('')}</tbody></table>`
      : '<p class="empty">Kein Begriff gefunden.<br><span class="ar" dir="rtl" lang="ar">لم يُعثر على أي مصطلح.</span></p>'}`;
  const gs = document.getElementById('gs');
  gs.addEventListener('input', e => { const v = e.target.value; woerter(v); const n = document.getElementById('gs'); n.focus(); n.setSelectionRange(v.length, v.length); });
}

function schilder(filter = '') {
  const f = filter.toLowerCase();
  const cats = SIGN_CATS.map(cat => {
    const items = SIGNS.filter(s => s.cat === cat.id && (!f || s.de.toLowerCase().includes(f) || s.ar.includes(filter)));
    if (!items.length) return '';
    return `<h2>${cat.de} <span class="ar" dir="rtl" lang="ar" style="font-size:14px;font-weight:400;color:var(--ink-2)">${cat.ar}</span></h2>
    <div class="signgrid">${items.map(s => `
      <div class="signcard">
        <div class="simg">${SIGN_ICON[s.icon]}</div>
        <div class="sname de">${s.de}</div>
        <div class="sname ar" dir="rtl" lang="ar">${s.ar}</div>
      </div>`).join('')}</div>`;
  }).join('');
  view.innerHTML = `<h1>Schilder</h1><p class="lede">Eigene, schematische Zeichnungen der wichtigsten Signaltypen – zum Wiedererkennen, nicht das offizielle Bildmaterial.</p>
  <input class="search" id="ss" type="search" placeholder="Suchen / بحث" value="${esc(filter)}" autocomplete="off">
  ${cats || '<p class="empty">Kein Signal gefunden.<br><span class="ar" dir="rtl" lang="ar">لم يُعثر على أي إشارة.</span></p>'}`;
  const ss = document.getElementById('ss');
  ss.addEventListener('input', e => { const v = e.target.value; schilder(v); const n = document.getElementById('ss'); n.focus(); n.setSelectionRange(v.length, v.length); });
}

/* ---------- Quiz-Engine ---------- */
function startQuiz(kind) {
  let idx;
  if (kind === 'all') idx = FRAGEN.map((_, i) => i);
  else if (kind === 'wrong') idx = wrongIndices();
  else if (kind === 'smart') idx = smartIndices(20);
  else idx = FRAGEN.map((_, i) => i).filter(i => FRAGEN[i].c === kind);
  idx = shuffle(idx);
  state.quiz = { list: idx, pos: 0, sel: [], checked: false, right: 0, exam: false, kind };
  renderQ();
}
function startExam() {
  const idx = shuffle(FRAGEN.map((_, i) => i)).slice(0, Math.min(50, FRAGEN.length));
  state.quiz = { list: idx, pos: 0, sel: [], checked: false, right: 0, exam: true, wrongN: 0, end: Date.now() + 45 * 60000 };
  tick();
  renderQ();
}
let timerId = null;
function tick() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    const q = state.quiz;
    if (!q || !q.exam) return clearInterval(timerId);
    const left = q.end - Date.now();
    const el = document.getElementById('tmr');
    if (left <= 0) { clearInterval(timerId); return finish(); }
    if (el) el.textContent = Math.floor(left / 60000) + ':' + String(Math.floor(left / 1000) % 60).padStart(2, '0');
  }, 500);
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };

function renderQ() {
  const q = state.quiz, i = q.list[q.pos], f = FRAGEN[i];
  const cat = MODULES.find(m => m.id === f.c);
  const pct = (q.pos / q.list.length) * 100;
  view.innerHTML = `
  <div class="progline"><i style="width:${pct}%"></i></div>
  <div class="qmeta">
    <span class="pill">${q.pos + 1} / ${q.list.length}</span>
    <span>${q.exam ? 'Prüfung' : cat.de}</span>
    ${q.exam ? '<span class="timer" id="tmr">45:00</span>' : ''}
  </div>
  ${f.scene && SCENES[f.scene] ? `<div class="scene">${SCENES[f.scene]}</div>` : ''}
  <p class="qtext">${T(f.q)}</p>
  <div id="opts">${f.a.map((o, k) => `<button class="opt" data-o="${k}" aria-pressed="false">${T(o)}</button>`).join('')}</div>
  <div id="fb"></div>
  <div class="actions">
    <button class="btn ghost" data-abort="1">Beenden</button>
    <button class="btn" id="main" disabled>Antwort prüfen</button>
  </div>`;
  if (q.exam) tick();
}

function checkQ() {
  const q = state.quiz, i = q.list[q.pos], f = FRAGEN[i];
  const ok = q.sel.length === f.correct.length && q.sel.every(x => f.correct.includes(x));
  q.checked = true;
  if (ok) q.right++; else if (q.exam) q.wrongN++;
  setBoxLevel(i, ok);
  bumpChapStats(f.c, ok);
  document.querySelectorAll('.opt').forEach((b, k) => {
    const good = f.correct.includes(k), chosen = q.sel.includes(k);
    if (good) b.classList.add('good');
    if (chosen && !good) b.classList.add('bad');
    if (good || chosen) b.insertAdjacentHTML('afterbegin', `<span class="tag">${good ? '✓' : '✕'}</span>`);
    b.disabled = true;
  });
  document.getElementById('fb').innerHTML = `<div class="expl ${ok ? 'win' : 'lose'}">
    <b>${ok ? 'Richtig' : 'Falsch'} · <span class="ar" dir="rtl" lang="ar">${ok ? 'صحيح' : 'خطأ'}</span></b>${T(f.e)}</div>`;
  const m = document.getElementById('main');
  m.textContent = q.pos + 1 >= q.list.length ? 'Ergebnis ansehen' : 'Nächste Frage';
  m.disabled = false;
}

function next() {
  const q = state.quiz;
  q.pos++; q.sel = []; q.checked = false;
  if (q.pos >= q.list.length) return finish();
  renderQ();
}

function finish() {
  clearInterval(timerId);
  const q = state.quiz, total = q.list.length, right = q.right;
  const pct = Math.round(right / total * 100);
  let head;
  if (q.exam) {
    const fp = (total - right) * 3, pass = fp <= 15;
    if (pct > store.get('bestExam', 0)) store.set('bestExam', pct);
    head = `<div class="card score ${pass ? 'pass' : 'fail'}">
      <div class="num">${fp}</div>
      <div style="color:var(--ink-2);font-size:14px">Fehlerpunkte · نقاط الخطأ</div>
      <div class="verdict">${pass ? 'Bestanden · ناجح' : 'Nicht bestanden · راسب'}</div>
      <p style="color:var(--ink-2);font-size:14px;margin:8px 0 0">${right} von ${total} richtig · erlaubt sind höchstens 15 Fehlerpunkte</p>
    </div>`;
  } else {
    head = `<div class="card score"><div class="num">${pct}%</div>
      <div style="color:var(--ink-2);font-size:14px">${right} von ${total} richtig · <span class="ar" dir="rtl" lang="ar">${right} من ${total} صحيحة</span></div></div>`;
  }
  const w = wrongIndices().length;
  view.innerHTML = head + `
  <div class="actions"><button class="btn ghost" data-go="home">Zur Startseite</button>
  <button class="btn" data-quiz="${q.exam ? 'smart' : (q.kind || 'smart')}">Weiterüben</button></div>
  ${w ? `<button class="row" data-quiz="wrong"><span class="ic">!</span><span class="tx"><b>Meine Fehler wiederholen (${w})</b><span class="ar" dir="rtl" lang="ar">مراجعة أخطائي</span></span><span class="chev">›</span></button>` : ''}`;
  state.quiz = null;
}

/* ---------- Router ---------- */
function go(s) {
  state.screen = s; clearInterval(timerId); state.quiz = null;
  document.querySelectorAll('.nb button').forEach(b => b.setAttribute('aria-current', b.dataset.go === s ? 'page' : 'false'));
  ({ home, theorie, quiz: quizMenu, pruefung: pruefungIntro, schilder, woerter, stats })[s]();
  window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-mod],[data-quiz],[data-exam],[data-done],[data-o],[data-abort],[data-lang]');
  if (!t) return;
  if (t.dataset.lang) {
    document.body.dataset.lang = t.dataset.lang;
    store.set('lang', t.dataset.lang);
    document.querySelectorAll('.langsw button').forEach(b => b.setAttribute('aria-pressed', b === t));
    return;
  }
  if (t.dataset.o !== undefined) {
    const q = state.quiz; if (!q || q.checked) return;
    const k = +t.dataset.o, on = q.sel.includes(k);
    if (on) q.sel = q.sel.filter(x => x !== k);
    else { if (q.sel.length >= 2) q.sel.shift(); q.sel.push(k); }
    document.querySelectorAll('.opt').forEach((b, i) => b.setAttribute('aria-pressed', q.sel.includes(i)));
    document.getElementById('main').disabled = q.sel.length === 0;
    return;
  }
  if (t.dataset.abort) return go('home');
  if (t.dataset.done) {
    const d = getDone(), id = t.dataset.done;
    store.set('doneMods', d.includes(id) ? d.filter(x => x !== id) : d.concat(id));
    modul(id); return;
  }
  if (t.dataset.mod) { state.mod = t.dataset.mod; modul(t.dataset.mod); window.scrollTo(0, 0); return; }
  if (t.dataset.quiz) { startQuiz(t.dataset.quiz); window.scrollTo(0, 0); return; }
  if (t.dataset.exam) { startExam(); window.scrollTo(0, 0); return; }
  if (t.dataset.go) go(t.dataset.go);
});

document.getElementById('view').addEventListener('click', e => {
  if (e.target.id === 'main' && state.quiz) state.quiz.checked ? next() : checkQ();
});

/* Start */
const saved = store.get('lang', 'both');
document.body.dataset.lang = saved;
document.querySelectorAll('.langsw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === saved));
go('home');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
