<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>AMI Engineering Intelligence — Engineering Knowledge &amp; Reuse Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --petrol: #0F1A1F; --petrol2: #16262E; --blue: #24506B; --steel: #8D98A3;
    --paper: #E9EAE6; --paper2: #DCDED8; --ink: #131A1E; --yellow: #E8B400;
    --rule: #C9CCC6; --soft: #F3F4F1;
  }
  @page { size: A4; }
  * { box-sizing: border-box; }
  h2, h3, h4, .section-head { page-break-after: avoid; }
  .section-head { margin-top: 6mm; page-break-inside: avoid; }
  .section-head + p, .section-head + .lead { page-break-before: avoid; }
  .page > .section-head:first-child { margin-top: 0; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; font-size: 9.6pt; line-height: 1.5; color: var(--ink); background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { padding: 0 18mm; }
  .break { page-break-before: always; }
  .avoid { page-break-inside: avoid; }
  h1, h2, h3, h4 { font-family: 'Archivo', sans-serif; color: var(--petrol); margin: 0; line-height: 1.15; }
  h2 { font-size: 17pt; font-weight: 700; margin: 0 0 4mm; padding-top: 1mm; letter-spacing: -.005em; }
  h2 .n { display: inline-block; min-width: 9mm; color: var(--steel); font-weight: 500; }
  h3 { font-size: 11.5pt; font-weight: 600; margin: 5mm 0 2mm; }
  h4 { font-size: 9.8pt; font-weight: 600; margin: 3.5mm 0 1.5mm; color: var(--blue); }
  p { margin: 0 0 2.6mm; }
  .lead { font-size: 10.6pt; color: var(--petrol2); }
  ul, ol { margin: 0 0 2.6mm; padding-left: 5mm; }
  li { margin-bottom: 1mm; }
  li::marker { color: var(--blue); }
  strong { font-weight: 600; color: var(--petrol); }
  code, .mono { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 8.6pt; }
  a { color: var(--blue); text-decoration: none; word-break: break-all; }
  .section-head { border-top: 2px solid var(--petrol); padding-top: 3mm; margin-bottom: 4mm; }
  .section-head .over { font-size: 7.5pt; letter-spacing: .18em; text-transform: uppercase; color: var(--steel); margin-bottom: 1.5mm; }
  .pitch { width: 40mm; height: 2px; background: repeating-linear-gradient(90deg, var(--yellow) 0 5mm, transparent 5mm 7.5mm); margin: 3mm 0 4mm; }

  /* callouts */
  .callout { border-left: 3px solid var(--blue); background: var(--soft); padding: 3mm 4mm; margin: 3mm 0 4mm; page-break-inside: avoid; }
  .callout.key { border-color: var(--yellow); background: #FBF7E6; }
  .callout.warn { border-color: #B0413E; background: #F8EFEE; }
  .callout .t { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 8pt; letter-spacing: .12em; text-transform: uppercase; color: var(--petrol); margin-bottom: 1.5mm; }
  .callout p:last-child { margin-bottom: 0; }
  .quote { font-family: 'Archivo', sans-serif; font-weight: 500; font-size: 12.5pt; line-height: 1.35; color: var(--petrol); border-left: 3px solid var(--yellow); padding-left: 5mm; margin: 4mm 0 5mm; }

  /* grid boxes */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; margin: 2mm 0 4mm; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4mm; margin: 2mm 0 4mm; }
  .box { border: 1px solid var(--rule); padding: 3mm 3.5mm; page-break-inside: avoid; }
  .box h4 { margin-top: 0; }
  .box p:last-child { margin-bottom: 0; }
  .kpi { border-top: 2px solid var(--blue); padding: 2.5mm 0 0; }
  .kpi .v { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 18pt; color: var(--petrol); line-height: 1; }
  .kpi .l { font-size: 8pt; color: var(--steel); margin-top: 1mm; }

  /* tables */
  table { width: 100%; border-collapse: collapse; margin: 2mm 0 4mm; font-size: 8.4pt; line-height: 1.35; page-break-inside: auto; }
  thead { display: table-header-group; }
  tr { page-break-inside: avoid; }
  th { text-align: left; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 7.6pt; letter-spacing: .06em; text-transform: uppercase; color: var(--petrol); background: var(--paper); padding: 2mm 2mm; border-bottom: 1.5px solid var(--petrol); vertical-align: bottom; }
  td { padding: 1.8mm 2mm; border-bottom: 1px solid var(--rule); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.total td { font-weight: 600; background: var(--soft); border-top: 1.5px solid var(--petrol); }
  .small { font-size: 8pt; color: #4A545C; }
  .note { font-size: 7.8pt; color: #4A545C; margin: -2mm 0 4mm; line-height: 1.4; }
  .tag { display: inline-block; font-family: 'Archivo', sans-serif; font-size: 6.8pt; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: .6mm 1.8mm; border: 1px solid; line-height: 1.3; white-space: nowrap; }
  .tag.ok { color: #1F6B3A; border-color: #1F6B3A; background: #E8F3EC; }
  .tag.mid { color: #8A6100; border-color: #B88400; background: #FBF3DC; }
  .tag.bad { color: #8E2A27; border-color: #B0413E; background: #F8EBEA; }
  .tag.ami { color: var(--blue); border-color: var(--blue); background: #E7EEF3; }
  .tag.bench { color: var(--petrol); border-color: var(--petrol); background: var(--paper); }
  .tag.hyp { color: #4A545C; border-color: var(--steel); background: #F1F2F0; }
  .tag.scen { color: #7A5A00; border-color: var(--yellow); background: #FBF5DF; }
  .tag.ref { color: #4A545C; border-color: var(--steel); background: #fff; }

  /* figures */
  figure { margin: 3mm 0 5mm; page-break-inside: avoid; border: 1px solid var(--rule); padding: 3mm 3.5mm 2.5mm; }
  figure .fh { display: flex; justify-content: space-between; align-items: baseline; gap: 4mm; margin-bottom: 2mm; }
  figure .ft { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 9pt; color: var(--petrol); }
  figure svg { display: block; width: 100%; height: auto; }
  figcaption { font-size: 7.6pt; color: #4A545C; margin-top: 2mm; line-height: 1.4; }
  svg text { font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; }
  .diag { border: 1px solid var(--rule); padding: 3mm 3.5mm; margin: 3mm 0 5mm; page-break-inside: avoid; }

  /* TOC */
  .toc { columns: 1; }
  .toc ol { list-style: none; padding: 0; margin: 0; }
  .toc li { display: flex; gap: 3mm; align-items: baseline; padding: 0.55mm 0; border-bottom: 1px dotted var(--rule); font-size: 8.8pt; }
  .toc li .n { color: var(--steel); min-width: 7mm; font-family: 'IBM Plex Mono', monospace; font-size: 8.4pt; }
  .toc li .t { flex: 1; }
  .toc li .p { color: var(--steel); font-size: 8.4pt; }
  .toc-part { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 8pt; letter-spacing: .14em; text-transform: uppercase; color: var(--blue); margin: 3mm 0 0.5mm; }

  /* flow steps */
  .flow { display: flex; align-items: stretch; gap: 0; margin: 2mm 0 4mm; page-break-inside: avoid; }
  .flow .s { flex: 1; border: 1px solid var(--rule); padding: 2.2mm 2.4mm; font-size: 8pt; line-height: 1.35; position: relative; background: #fff; }
  .flow .s + .s { margin-left: 3mm; }
  .flow .s + .s::before { content: ""; position: absolute; left: -3mm; top: 50%; width: 3mm; height: 1px; background: var(--steel); }
  .flow .s b { display: block; font-family: 'Archivo', sans-serif; font-weight: 600; color: var(--petrol); font-size: 8.2pt; margin-bottom: .8mm; }
  .flow .s.human { background: #FBF7E6; border-color: var(--yellow); }
  .flow .s.ai { background: #E7EEF3; border-color: var(--blue); }
  .legend { font-size: 7.6pt; color: #4A545C; display: flex; gap: 5mm; margin: -2mm 0 4mm; }
  .legend i { display: inline-block; width: 3mm; height: 3mm; vertical-align: -0.4mm; margin-right: 1.2mm; border: 1px solid; }
  .legend .h { background: #FBF7E6; border-color: var(--yellow); }
  .legend .a { background: #E7EEF3; border-color: var(--blue); }
  .legend .n { background: #fff; border-color: var(--rule); }
</style>
</head>
<body>
